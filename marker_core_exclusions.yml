# Normal inference/sync applies this policy automatically to processed scenes.
# To remove existing owned markers with excluded cores without inference:
#   python stash_ai.py --cleanup-markers-only --dry-run
#   python stash_ai.py --cleanup-markers-only
# --sync-marker-core-only is an alias; --scene-id ID limits either command.
# Manual markers are preserved. Cleanup deletes the excluded-core marker;
# it does not remove the tag itself or promote one of its additional tags.
# Use excluded_core_tags: [] to allow every label as a core.
# After removing an exclusion, --merge-only rebuilds markers from saved evidence.

# Optional per-model additions; the common list above always applies.
by_model:
  joytag: []
  wd: []
  dtq: []
  oppai: []

