# Global output blacklist: scenes, marker cores, marker extras and hierarchy.
# The legacy filename and excluded_scene_tags key are kept for compatibility.
# excluded_tags is also accepted as the list key (use only one of the two).
# Common raw labels apply to all four models; matching is exact/case-sensitive.
# Use raw names WITHOUT ai:/jt:/wd:/dtq:/op:. Absent labels in a vocabulary are harmless.
version: 1
excluded_scene_tags:
  - "closed_eyes"
  - "rating:explicit"
  - "rating:general"
  - "rating:questionable"
  - "rating:sensitive"
  - "facial_hair"
  - "highres"
  - "blurry"
  - "solo"
  - "1boy"
  - "1girl"
  - "1other"
  - "no_humans"
  - "realistic"
  - "photorealistic"
  - "censored"
  - "game_cg"
  - "photo_(medium)"
  - "3d"
  - "virtual_youtuber"
  - "uncensored"
  - "watermark"
  - "web_address"
  - "english_text"
  - "fingernails"
  - "photoshop_(medium)"
  - "explicit"
  - "sex"
  - "aqua_hair"
  - "black_hair"
  - "blonde_hair"
  - "blue_hair"
  - "brown_hair"
  - "colored_inner_hair"
  - "colored_pubic_hair"
  - "dark_blue_hair"
