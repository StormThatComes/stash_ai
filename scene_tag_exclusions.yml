by_model:
  joytag: []
  wd: []
  dtq: []
  oppai: []

# Normal sync removes matching old associations even with replacement disabled.
# Full all-model cleanup deletes globally excluded definitions in batches,
# including their scene/extra associations and owned hierarchy edges.
# Children with allowed names remain. Other sync/scoped cleanup modes only
# prune now-unused excluded leaf definitions.
# python stash_ai.py --models all --cleanup-only --dry-run
# python stash_ai.py --models all --cleanup-only
# This includes old model prefixes and ai: names. A blocked primary deletes its
# marker; blocked extras are detached without changing the surviving marker.
# by_model removes only that source's evidence; another allowed source may keep
# the shared ai: label. Use the common list above to suppress a label everywhere.
# --markers-only and --scene-tags-only still limit which outputs are changed.
# Core-only exclusions remain in marker_core_exclusions.yml.
