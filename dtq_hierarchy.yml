# Proposed DanbooruTagQuery L/16 hierarchy; keep beside stash_ai.py.
# All 11,424 usable raw labels are explicitly present; no prediction whitelist.
# Shared labels inherit JoyTag groups. Other assignments are editable suggestions.
# Categories organize Stash parents; they do not rename, enable or suppress labels.
# Other / Unclassified is an ordinary group and does NOT exclude its labels.
# Named references describe predicted/source content, not verified identities/authorship.
# Move a label to change its parent; repeat it in another group for multiple parents.
# Keep raw label spelling, root and category_prefix stable. Preserve full coverage.
# replace_managed changes only hierarchy-owned parents; manual parents remain.
# Existing obsolete category objects are retained, not deleted.
# Validate: python stash_ai.py --models dtq --validate-hierarchy
# Preview: python stash_ai.py --models dtq --sync-hierarchy-only --dry-run
