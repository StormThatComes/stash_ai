# Benchmark overrides for the supplied recognition YAML. Run benchmark_dance_transfer to compare.
single-core:
  pose.detector.nms_threshold: 0.94
  pose.refinement.max_box_area_ratio: 3.0
  pose.refinement.max_prompt_points: 1
  pose.refinement.max_side_expansion: 1.1
  pose.refinement.min_prompt_points: 1
# Stronger mask score and tighter expansion, selected with clean ownership on the original set.
single-core-strict:
  pose.detector.nms_threshold: 0.94
  pose.refinement.max_prompt_points: 1
  pose.refinement.max_side_expansion: 0.75
  pose.refinement.min_mask_score: 0.7
  pose.refinement.min_prompt_points: 1
