# Each named profile overrides the same recognition YAML on every photograph.
stock: {}
four-prompts:
  pose.detector.nms_threshold: 0.94
  pose.refinement.min_prompt_points: 1
  pose.refinement.max_prompt_points: 4
  pose.refinement.min_keypoint_score: 0.65
  pose.refinement.min_mask_score: 0.45
  pose.refinement.max_box_area_ratio: 2.1
  pose.refinement.max_side_expansion: 1.1
single-prompt:
  pose.detector.nms_threshold: 0.94
  pose.refinement.max_box_area_ratio: 3.0
  pose.refinement.max_prompt_points: 1
  pose.refinement.max_side_expansion: 1.1
  pose.refinement.min_prompt_points: 1
# Selected across all 17 photographs under the ownership and extra-detection checks.
common:
  pose.detector.nms_threshold: 0.94
  pose.refinement.max_prompt_points: 1
  pose.refinement.min_keypoint_score: 0.75
  pose.refinement.min_prompt_points: 1
  pose.refinement.min_mask_score: 0.45
  pose.refinement.max_box_area_ratio: 3.0
  pose.refinement.max_side_expansion: 1.1
