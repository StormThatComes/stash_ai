# Run with --fit-all to score these existing YAML settings against all five photographs.
pose:
  stock: {}
  close-boxes:
    pose.detector.nms_threshold: 0.94
mask:
  stock: {}
  one-or-two:
    pose.refinement.min_prompt_points: 1
    pose.refinement.max_prompt_points: 2
    pose.refinement.min_keypoint_score: 0.70
    pose.refinement.min_mask_score: 0.45
  up-to-three:
    pose.refinement.min_prompt_points: 1
    pose.refinement.min_keypoint_score: 0.70
    pose.refinement.min_mask_score: 0.45
  four-and-expand:
    pose.refinement.min_prompt_points: 1
    pose.refinement.max_prompt_points: 4
    pose.refinement.min_keypoint_score: 0.65
    pose.refinement.min_mask_score: 0.45
    pose.refinement.max_box_area_ratio: 2.1
    pose.refinement.max_side_expansion: 1.1
