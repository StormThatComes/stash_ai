# --models joytag | --models wd dtq | --models oppai | --models all
# Models run in separate passes; one model occupies GPU memory at a time.
# Default output is shared ai: tags and same-label interval unions.
# --models selects new inference; cached contributions from other models remain.
# Keep tagger_sources.sqlite3; --state-db selects a durable location.
# stash_ai.py resumes matching results/checkpoints by default in merged mode.
# --restart requests fresh inference; omit it when resuming that new run.
# --prefetch-batches 4 prepares four next batches; 0 disables batch/scene lookahead.
# --ram-budget-gb 32 / --ram-cache-gb 24 bound the shared cache; allocated on demand.
# --prepare-workers 4 parallelizes CPU transforms across batches with prefetch enabled.
# One GPU owner overlaps work with results/checkpoints and previous-scene finalization.
# One next scene also prepares up to min(prefetch_batches, 2) CPU batches in RAM.
# Current/next scenes share prepare_workers; SQLite/checkpoints stay on the main thread.
# --verbose enables per-scene diagnostics; default output summarizes the collection.
# No sprite or extracted-frame cache is written to disk.
# --merge-only migrates existing results without model inference.
# Historical model-prefixed outputs can be imported with --import-legacy-only.
# Optional per-model scene_cache_floor / marker_cache_floor keep weaker scores
# for later offline retuning. Omitted/null preserves automatic retention.
# Retention only widens the cache; publication thresholds still apply.
version: 1
enabled_models: [joytag, oppai, wd, dtq]
device: cuda  # auto prefers CUDA; cuda requires CUDA; cpu forces CPU.
download_missing: true  # All four models, including JoyTag; --offline disables downloads.
prefetch_batches: 4  # Global 0..16; 0 also disables inference lookahead. Separate from model batch_size.
prepare_workers: 4  # CPU image transforms; --prepare-workers overrides. Integer 1..16.
merge_workers: 4  # Read-only evidence replay; --merge-workers overrides. Integer 1..16.
model_report_workers: 4  # Offline report processes; --model-report-workers overrides. Integer 1..16.

# All models download missing assets from pinned Hugging Face revisions.
# model_dir / *_MODEL_PATH select download locations; relative paths use this YAML.
# JoyTag uses model.safetensors and downloads its Python architecture from the
# author's pinned HF Space into the Hugging Face cache. No code_dir is needed.
joytag:
  model_dir: models/joytag
  scene_threshold: 0.45
  marker_threshold: 0.70
  scene_cache_floor: 0.20
  marker_cache_floor: 0.30
  batch_size: 16

wd:
  model_dir: models/wd-eva02-large-tagger-v3
  scene_threshold: 0.40
  marker_threshold: 0.70
  scene_cache_floor: 0.20
  marker_cache_floor: 0.25
  batch_size: 4

dtq:
  model_dir: models/danbooru-tag-query-l16
  scene_threshold: 0.25
  marker_threshold: 0.70
  scene_cache_floor: 0.10
  marker_cache_floor: 0.15
  batch_size: 4

oppai:
  model_dir: models/oppai-oracle-v1.1
  scene_threshold: 0.80
  marker_threshold: 0.85
  scene_cache_floor: 0.35
  marker_cache_floor: 0.40
  batch_size: 4

# All vocabulary entries/categories are eligible. No whitelist is used.
# Thresholds are starting points, not a guarantee of accuracy for your scenes.
# Count caps are disabled in the script (0 = unlimited); time grouping,
# MARKER_MIN_HITS and confidence thresholds still apply.
# WD_MODEL_PATH, DTQ_MODEL_PATH and OPPAI_MODEL_PATH override the paths above.
# OppaiOracle uses source code op (historical op: tags) and --models oppai.
# "all" runs four models. Merged marker titles identify sources, e.g. [jt+wd+op].
# Bundled defaults: joytag_hierarchy.yml, wd_hierarchy.yml, dtq_hierarchy.yml,
# oppai_hierarchy.yml. Override with --hierarchy / --wd-hierarchy /
# --dtq-hierarchy / --oppai-hierarchy, or disable with --no-hierarchy.
