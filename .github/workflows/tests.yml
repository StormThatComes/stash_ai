name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Group automatic runs by branch or PR ref and give each manual run its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.7'

jobs:
  plan:
    name: Select CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pytest: ${{ steps.select.outputs.pytest }}
      updater: ${{ steps.select.outputs.updater }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      recognition: ${{ steps.select.outputs.recognition }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate the complete PR diff
        id: select
        run: python -m tests.ci_jobs plan

  updater:
    needs: plan
    if: needs.plan.outputs.updater == 'true'
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install --system pytest
      - run: python -m pytest -q tests/test_updater.py --tb=short

  pytest:
    needs: plan
    if: needs.plan.outputs.pytest == 'true'
    name: pytest (Linux ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-cpu.txt
            constraints/*.txt

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements-cpu.txt -r requirements-dev.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match

      - name: Trace configured recognition writes on Linux
        if: matrix.shard == 1
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          command -v strace || (sudo apt-get update -qq && sudo apt-get install -y strace)
          root="$RUNNER_TEMP/recognition-allowed"
          strace -f -qq -y -s 500 -e trace=%file -o "$RUNNER_TEMP/recognition.trace" python -B -m tests.recognition_storage_probe "$root"
          python -B -m tests.recognition_write_trace "$root" "$RUNNER_TEMP/recognition.trace" linux

      - name: Diagnostic overhead benchmark
        if: matrix.shard == 1
        run: |
          python -m benchmarks.benchmark_run_history --frames 128 --labels 12 --repeats 3 > /tmp/run_history.json
          python -c "import json; r=json.load(open('/tmp/run_history.json')); print('HISTORY_BENCHMARK_SUMMARY ' + json.dumps({'scope':r['scope'],'frames':r['frames'],'labels':r['labels'],'identical_evidence':r['identical_evidence'],'groups':r['groups'],'trials':r['trials']}))"

      - name: Pinned evidence write benchmark
        if: matrix.shard == 1
        run: |
          python -m benchmarks.benchmark_pinned_proofs --frames 256 --labels 12 --repeats 3 > /tmp/pinned_proofs.json
          python -c "import json; r=json.load(open('/tmp/pinned_proofs.json')); print('PINNED_BENCHMARK_SUMMARY ' + json.dumps(r))"

      - name: Run tests
        env:
          STASH_API_KEY: ""
          STASH_AI_HF_SMOKE: "1"
        run: >-
          python -m pytest -p tests.ci_shards --ci-shard=${{ matrix.shard }}
          -q --tb=short --maxfail=1 --durations=20 --junitxml="${{ runner.temp }}/pytest.xml"

      - name: Save per-test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7

  dependency-resolution:
    needs: plan
    if: needs.plan.outputs.dependencies == 'true'
    name: dependencies (${{ matrix.variant }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [cpu, gpu]
        platform: [x86_64-manylinux_2_28, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Resolve complete profiles without installing GPU packages
        run: >-
          uv pip compile requirements-${{ matrix.variant }}.txt requirements-dev.txt
          -c constraints/${{ matrix.variant }}-py314.txt --python-version 3.14.7
          --python-platform ${{ matrix.platform }} --index-strategy unsafe-best-match
          --only-binary :all: --no-binary iopath --no-binary antlr4-python3-runtime
          -o /tmp/resolved.txt

  recognition-models:
    needs: plan
    if: needs.plan.outputs.recognition == 'true'
    name: recognition CPU (${{ matrix.os }}, ${{ matrix.suite }} ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install complete application CPU profile
        run: uv pip install --system pytest -r requirements-cpu.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match
      - name: Load pinned CPU models
        if: matrix.smoke && matrix.suite != 'video'
        env:
          STASH_AI_RECOGNITION_SMOKE: '1'
          STASH_API_KEY: ''
        run: python -m pytest -q tests/test_recognition_model_smoke.py --tb=short
      - name: Verify simultaneous solver trials with the complete CPU profile
        if: runner.os == 'Windows' && matrix.suite == 'core' && matrix.shard == 1
        run: python -m pytest -q tests/test_recognition_solver_concurrency.py --tb=short
      - name: Install FFmpeg on Windows for tiny-video fixtures
        if: matrix.suite == 'video'
        run: choco install ffmpeg -y --no-progress
      - name: Trace configured recognition writes on Windows
        if: runner.os == 'Windows' && matrix.suite == 'core' && matrix.shard == 1
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          $zip = Join-Path $env:RUNNER_TEMP procmon.zip
          $bin = Join-Path $env:RUNNER_TEMP procmon
          Invoke-WebRequest https://download.sysinternals.com/files/ProcessMonitor.zip -OutFile $zip
          Expand-Archive $zip $bin
          $exe = Join-Path $bin Procmon64.exe
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Invalid Process Monitor signature' }
          $pml = Join-Path $env:RUNNER_TEMP recognition.pml
          $csv = Join-Path $env:RUNNER_TEMP recognition.csv
          $root = Join-Path $env:RUNNER_TEMP recognition-allowed
          Start-Process $exe -ArgumentList "/AcceptEula /Quiet /Minimized /BackingFile `"$pml`""
          Start-Process $exe -ArgumentList '/WaitForIdle' -Wait
          try {
            python -B -m tests.recognition_storage_probe "$root"
            if ($LASTEXITCODE) { throw 'Recognition probe failed' }
          } finally { Start-Process $exe -ArgumentList '/Terminate' -Wait }
          Start-Process $exe -ArgumentList "/OpenLog `"$pml`" /SaveAs `"$csv`"" -Wait
          python -B -m tests.recognition_write_trace "$root" "$csv" windows

      - name: Run Windows lifecycle tests
        if: runner.os == 'Windows'
        env:
          # Each partition has its own runner; subprocesses inherit bounded
          # native thread defaults while explicit application budgets still apply.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m tests.ci_windows ${{ matrix.suite }} ${{ matrix.shard }} --profile ${{ matrix.profile }}
          --tb=short --maxfail=1 --durations=20 --junitxml="${{ runner.temp }}/lifecycle.xml"
      - name: Save Windows lifecycle durations
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lifecycle.xml
          retention-days: 7

  result:
    name: CI result
    if: ${{ always() }}
    needs: [plan, updater, pytest, dependency-resolution, recognition-models]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every selected job succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -m tests.ci_jobs check
