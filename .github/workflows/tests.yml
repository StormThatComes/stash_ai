name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only superseded revisions of the same pull request can cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.7'

jobs:
  plan:
    name: Select CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pytest: ${{ steps.select.outputs.pytest }}
      updater: ${{ steps.select.outputs.updater }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      recognition: ${{ steps.select.outputs.recognition }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Evaluate the complete PR diff
        id: select
        run: python -m tests.ci_jobs plan

  updater:
    needs: plan
    if: needs.plan.outputs.updater == 'true'
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install --system pytest
      - run: python -m pytest -q tests/test_updater.py --tb=short

  pytest:
    needs: plan
    if: needs.plan.outputs.pytest == 'true'
    name: pytest (Linux ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-cpu.txt
            constraints/*.txt

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements-cpu.txt -r requirements-dev.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match

      - name: Diagnostic overhead benchmark
        if: matrix.shard == 1
        run: |
          python -m benchmarks.benchmark_run_history --frames 128 --labels 12 --repeats 3 > /tmp/run_history.json
          python -c "import json; r=json.load(open('/tmp/run_history.json')); print('HISTORY_BENCHMARK_SUMMARY ' + json.dumps({'scope':r['scope'],'frames':r['frames'],'labels':r['labels'],'identical_evidence':r['identical_evidence'],'groups':r['groups'],'trials':r['trials']}))"

      - name: Pinned evidence write benchmark
        if: matrix.shard == 1
        run: |
          python -m benchmarks.benchmark_pinned_proofs --frames 256 --labels 12 --repeats 3 > /tmp/pinned_proofs.json
          python -c "import json; r=json.load(open('/tmp/pinned_proofs.json')); print('PINNED_BENCHMARK_SUMMARY ' + json.dumps(r))"

      - name: Run tests
        env:
          STASH_API_KEY: ""
          STASH_AI_HF_SMOKE: "1"
        run: >-
          python -m pytest -p tests.ci_shards --ci-shard=${{ matrix.shard }}
          -q --tb=short --maxfail=1 --durations=20 --junitxml="${{ runner.temp }}/pytest.xml"

      - name: Save per-test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7

  dependency-resolution:
    needs: plan
    if: needs.plan.outputs.dependencies == 'true'
    name: dependencies (${{ matrix.variant }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [cpu, gpu]
        platform: [x86_64-manylinux_2_28, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Resolve complete profiles without installing GPU packages
        run: >-
          uv pip compile requirements-${{ matrix.variant }}.txt requirements-dev.txt
          -c constraints/${{ matrix.variant }}-py314.txt --python-version 3.14.7
          --python-platform ${{ matrix.platform }} --index-strategy unsafe-best-match
          --only-binary :all: --no-binary iopath --no-binary antlr4-python3-runtime
          -o /tmp/resolved.txt

  recognition-models:
    needs: plan
    if: needs.plan.outputs.recognition == 'true'
    name: recognition CPU (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install complete application CPU profile
        run: uv pip install --system -r requirements-dev.txt -r requirements-cpu.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match
      - name: Load pinned CPU models
        if: matrix.smoke && matrix.suite != 'video'
        env:
          STASH_AI_RECOGNITION_SMOKE: '1'
          STASH_API_KEY: ''
        run: python -m pytest -q tests/test_recognition_model_smoke.py --tb=short
      - name: Verify simultaneous solver trials with the complete CPU profile
        if: matrix.suite != 'video'
        run: python -m pytest -q tests/test_recognition_solver_concurrency.py --tb=short
      - name: Install FFmpeg on Windows for tiny-video fixtures
        if: matrix.suite == 'video'
        run: choco install ffmpeg -y --no-progress
      - name: Run Windows lifecycle tests
        if: runner.os == 'Windows'
        env:
          # Two independent pytest workers; each module keeps its fixture order.
          # Native libraries and solver subprocesses inherit a bounded baseline.
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: >-
          python -m pytest -q "@.github/ci/windows-${{ matrix.suite }}.txt"
          -n 2 --dist=loadfile --max-worker-restart=0
          --tb=short --maxfail=1 --durations=20 --junitxml="${{ runner.temp }}/lifecycle.xml"
      - name: Save Windows lifecycle durations
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows-${{ matrix.suite }}
          path: ${{ runner.temp }}/lifecycle.xml
          retention-days: 7

  result:
    name: CI result
    if: ${{ always() }}
    needs: [plan, updater, pytest, dependency-resolution, recognition-models]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify every selected job succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -m tests.ci_jobs check
