name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-target:
    name: Python target
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Read project target
        id: versions
        shell: bash
        run: |
          python_target=$(tr -d '\r\n' < .python-version)
          [[ "$python_target" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'versions=["%s","3.14.7"]\n' "$python_target" >> "$GITHUB_OUTPUT"

  updater:
    name: updater (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: python-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ${{ fromJSON(needs.python-target.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install --system pytest
      - run: python -m pytest -q tests/test_updater.py --tb=short

  pytest:
    name: pytest (Python ${{ matrix.python }})
    needs: python-target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.python-target.outputs.versions) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-ci-ml.txt

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system -r requirements-ci-ml.txt --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        env:
          STASH_API_KEY: ""
          STASH_AI_HF_SMOKE: "1"
        run: python -m pytest -q --tb=short
