name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.7'

jobs:
  updater:
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install --system pytest
      - run: python -m pytest -q tests/test_updater.py --tb=short

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        env:
          STASH_API_KEY: ""
          STASH_AI_HF_SMOKE: "1"
        run: python -m pytest -q --tb=short
