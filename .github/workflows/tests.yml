name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.7'

jobs:
  updater:
    name: updater (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements-dev.txt
      - run: uv pip install --system pytest
      - run: python -m pytest -q tests/test_updater.py --tb=short

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            requirements-cpu.txt
            constraints/*.txt

      - name: Install test dependencies
        run: |
          uv pip install --system -r requirements-cpu.txt -r requirements-dev.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match

      - name: Offline benchmark smoke
        run: python -m pytest -q tests/test_benchmarks.py --tb=short

      - name: Diagnostic overhead benchmark
        run: |
          python -m benchmarks.benchmark_run_history --frames 128 --labels 12 --repeats 3 > /tmp/run_history.json
          python -c "import json; r=json.load(open('/tmp/run_history.json')); print('HISTORY_BENCHMARK_SUMMARY ' + json.dumps({'scope':r['scope'],'frames':r['frames'],'labels':r['labels'],'identical_evidence':r['identical_evidence'],'groups':r['groups'],'trials':r['trials']}))"

      - name: Pinned evidence write benchmark
        run: |
          python -m benchmarks.benchmark_pinned_proofs --frames 256 --labels 12 --repeats 3 > /tmp/pinned_proofs.json
          python -c "import json; r=json.load(open('/tmp/pinned_proofs.json')); print('PINNED_BENCHMARK_SUMMARY ' + json.dumps(r))"

      - name: Run tests
        env:
          STASH_API_KEY: ""
          STASH_AI_HF_SMOKE: "1"
        run: python -m pytest -q --tb=short

  dependency-resolution:
    name: dependencies (${{ matrix.variant }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        variant: [cpu, gpu]
        platform: [x86_64-manylinux_2_28, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Resolve pinned wheels without installing GPU packages
        run: >-
          uv pip compile requirements-${{ matrix.variant }}.txt requirements-dev.txt
          -c constraints/${{ matrix.variant }}-py314.txt --python-version 3.14.7
          --python-platform ${{ matrix.platform }} --index-strategy unsafe-best-match
          --only-binary :all: -o /tmp/resolved.txt

  recognition-models:
    name: recognition CPU models (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Expanded lifecycle regressions need room for Windows model setup and
    # post-job cleanup; the previous 20-minute limit expired after 748 passes.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install complete application CPU profile
        run: uv pip install --system pytest -r requirements-cpu.txt -c constraints/cpu-py314.txt --index-strategy unsafe-best-match
      - name: Load pinned YuNet, SFace, AuraFace, FaceOcc and expression task on CPU
        env:
          STASH_AI_RECOGNITION_SMOKE: '1'
          STASH_API_KEY: ''
        run: python -m pytest -q tests/test_recognition_model_smoke.py tests/test_recognition_portrait_quality_batches.py --tb=short
      - name: Install FFmpeg on Windows for tiny-video fixtures
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Verify selected-scene video and metadata lifecycle
        run: python -m pytest -q tests/test_recognition_video.py tests/test_recognition_metadata.py tests/test_recognition_vtt_portraits.py tests/test_recognition_best_available.py tests/test_recognition_portrait_removal.py tests/test_recognition_visibility.py tests/test_recognition_expression.py tests/test_recognition_image_retry.py tests/test_recognition_aura.py tests/test_recognition_runtime.py tests/test_recognition_clustering.py tests/test_recognition_scene_context.py tests/test_recognition_identity_merges.py tests/test_recognition_storage.py tests/test_recognition_run.py tests/test_recognition_portraits.py tests/test_recognition_backend.py tests/test_recognition_prefetch.py tests/test_recognition_config.py tests/test_recognition_scanning.py tests/test_recognition_detection_quality.py tests/test_recognition_rebuild.py tests/test_recognition_models.py tests/test_recognition_phase_progress.py tests/test_recognition_progress.py tests/test_verified_model_inputs.py tests/test_recognition_portrait_budgets.py tests/test_recognition_evidence_safety.py tests/test_stash_startup_and_prune_safety.py tests/test_recognition_diagnostic_safety.py tests/test_history_schema_atomicity.py tests/test_history_invalid_values.py tests/test_recognition_media_recovery.py tests/test_recognition_identity_consistency.py tests/test_recognition_input_contracts.py tests/test_recognition_retained_validation.py tests/test_recognition_portrait_ranking.py tests/test_recognition_publication_ownership.py tests/test_recognition_model_recovery.py tests/test_recognition_video_recovery.py tests/test_recognition_shutdown_safety.py tests/test_owned_shutdown.py tests/test_recognition_state_safety.py tests/test_recognition_replay_checkpoints.py --tb=short
