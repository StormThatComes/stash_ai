# Loaded only by explicit `recognition run` / `recognition portraits`; never enables a background task.
# Similarities are cosine scores, not identity probabilities. These conservative
# starting defaults have no claimed accuracy calibration for your VTT library.
# Complete supported settings; optional features remain disabled where indicated.
version: 1
models:
  detector: scrfd_10g        # Default: SCRFD 10G KPS; options scrfd_2_5g, yunet.
  recognizer: sface             # Options: sface, auraface, lvface_b, adaface_ir50; ONNX Runtime for all.
  device: cuda                 # GPU by default. CPU profile: explicitly choose cpu.
  directory: recognition_models
  download_missing: true       # Only inside the explicit recognition invocation.
detection:
  score_threshold: 0.90
  nms_threshold: 0.30
  min_face_pixels: 32
  min_sharpness: 10.0
  max_faces_per_frame: 100
  max_pose_deviation: 0.50     # Hard five-landmark pose gate, not degrees; null disables.
  min_visible_face_fraction: 0.50 # Hard scan floor; must not exceed either role-specific visibility threshold.
  require_complete_face: true # Reject face boxes cut off by the thumbnail boundary.
recognition:
  metric: cosine
  match_threshold: 0.65        # Higher means more similar. Calibrate independently per model.
  ambiguity_margin: 0.10
  cooccurrence_merge_threshold: 0.90 # Stronger cross-sample evidence for possible reflections.
  cross_scene_provisional: true # Accumulate independent withheld anchor support across selected scenes.
  min_identity_support: 2      # Require two independent cues; cross-scene provisional can supply both.
  min_merge_support: 3         # Distinct scene/time observations before merging identities.
clustering:
  cohesion_threshold: 0.60     # Minimum sample similarity for matching and group merges.
  same_scene_match_bonus: 0.03 # Lower local match AND cohesion for attachments and supported in-scene merges.
  same_scene_min_support: 3    # Strict local anchor cue times before local matching or merging.
  max_anchor_pose_deviation: 0.20 # Higher-pose faces may match anchors but never seed identities.
  min_anchor_visible_face_fraction: 0.80 # Pose AND visibility must pass to seed strict references.
  min_auxiliary_visible_face_fraction: 0.50 # Lower-visibility faces may query known identities; never seed a core.
  min_anchor_face_pixels: null  # Optional stricter retained-sample floor; detection remains the hard scan floor.
  min_anchor_sharpness: null
  min_auxiliary_face_pixels: null
  min_auxiliary_sharpness: null
  anchor_outlier_quarantine: false # Experimental attachment-only clean core; original anchors remain rivals.
  adaptive_view_witnesses: false # Grow witnesses with independent support, preserving diverse endpoints.
  max_view_witnesses: 32       # Used only by adaptive_view_witnesses; jointly charged to reference budget.
  deduplicate_detections: false # Experimental same-cue IoU + landmark + embedding duplicate proof.
  auxiliary_matching: true    # Attach profiles after strict groups are established.
  auxiliary_min_support: 1    # Distinct scene/time observations required to accept attachments.
  view_prototypes_enabled: true # Opt in to multi-view identity reference prototypes.
  context_view_enrichment: true # Additional views only after strict-core revalidation of 2+ contextual cues.
  corroborated_view_enrichment: true # 2 query scenes plus 2 disjoint rooted views or one strict view supported in 2 other scenes; one generation.
  strict_appearance_matching: true # Match supported strict looks with ordinary thresholds; keep recovered queries attachment-only.
  anchor_view_matching: true    # Additional frozen subcluster matching for withheld anchor observations.
  view_min_support: 3          # Independent anchor-confirmed cues needed to promote a view.
  view_cohesion_threshold: 0.80 # All retained exemplars must agree; no single-link chaining.
  view_match_threshold: 0.82   # Stronger cosine gate for matching via a view prototype.
  view_ambiguity_margin: 0.12 # Rival identities remain independently checked.
  view_attach_min_support: 2  # New view-only attachments need independent cues.
  max_view_prototypes_per_person: 4 # Bounded confirmed view reference medoids.
  max_samples_per_person: 32
  max_people_per_lookup: 20000
  max_reference_bytes: 134217728 # 128 MiB of float32 references; run reports usage/peak. Not total RAM/VRAM.
portraits:
  kind: auto                  # auto: prefer a good face, otherwise an accepted person crop; face or person forces one kind.
  enabled: true               # false removes app-owned portraits for selected accepted people.
  anchor_only: false          # true requires face anchor quality or an accepted person anchor.
  source: vtt                  # Default: recognition thumbnail. Optional video uses FFmpeg.
  # Quality targets are ranking preferences: imperfect faces still supply a portrait.
  # detection.* remains the separate hard gate for recognition observations.
  min_face_pixels: 96          # Preferred actual face pixels; 0 removes this target penalty.
  min_sharpness: 25.0
  max_pose_deviation: 0.35
  min_exposure: 30.0
  max_exposure: 225.0
  max_clipped_fraction: 0.15
  min_visible_face_fraction: 0.80 # Preferred visible fraction; 0 removes the extra target penalty.
  margin: 0.35                 # Extra padding per side, relative to face width/height.
  aspect_ratio: null           # null = padded face shape; 0.8 = 4:5. Adapts if the source cannot fit it.
  jpeg_quality: 90             # Preferred 1..100; lowers quality/size to fit storage.max_crop_bytes.
  max_candidates: 8           # Video only. VTT ranks all retained observations of selected people.
  time_offsets: [0.0, -0.5, 0.5] # Video only.
  timeout_seconds: 30.0        # Video only.
  max_video_bytes: 67108864    # Video only.
  ffmpeg: ffmpeg               # Video only; executable name or path.
  weights:
    frontal: 3.0
    sharpness: 2.0
    resolution: 1.0
    exposure: 1.0
    visibility: 3.0            # 0 disables portrait visibility inference; detection gate is independent.
    neutral_expression: 0.0    # Opt-in: e.g. 3.0 prefers weaker visible expression.
    closed_mouth: 0.0          # Opt-in: e.g. 2.0 favors a lower jawOpen score.
    open_mouth: 0.0            # Favors jawOpen instead; normally choose one mouth weight.
    open_eyes: 0.0             # Opt-in: e.g. 2.0 penalizes either eye blinking.
execution:
  rebuild_cohort_backend: threads # threads or processes (spawn); only scene-local CPU cohorts.
  scan_cpu_workers: 4 # CPU quality/alignment/JPEG; inference remains on one owner.
  scan_queue_bytes: 268435456 # 256 MiB for in-flight scan CPU work; oversize work runs serially.
  recognizer_batch_size: 1 # Opt-in microbatch (up to 32); static ONNX graphs always use one.
  # Persistent compressed VTT/sprite cache, revalidated by strong HTTP ETags. 0 disables.
  media_cache_bytes: 1073741824
  portrait_ranking_cache_bytes: 16777216 # 16 MiB of completed VTT rankings; 0 disables.
  sprite_cache_bytes: 1073741824 # Shared compressed + decoded sprite LRU for this run.
  prefetch_scene_depth: 3 # Prepared scenes ahead; at most four input workers.
  rebuild_workers: 1           # 1 = serial; 0 = auto (up to 16); explicit values up to 256.
  rebuild_native_threads: 1    # BLAS threads per compute worker; effective workers respect available CPUs.
  rebuild_queue_bytes: 67108864 # Pending CPU work cap; shares working memory with caches and metadata.
  rebuild_cache_bytes: 1073741824 # Immutable LRU cap; borrows idle working memory and evicts for queues/banks; 0 disables.
  rebuild_matrix_cache_bytes: 536870912 # Packed matrices share the above budget (512 MiB).
  rebuild_memory_bytes: 8589934592  # Lazy working-cache budget (8 GiB); configurable for large-RAM hosts.
  portrait_cpu_threads: 0      # 0 = native defaults; 1 = serial; 2..16 = total CPU budget.
  portrait_faceocc_batch_size: 4 # Portrait-only visibility microbatch; 1 = scalar.
  prefetch_portraits: true     # Isolated bounded VTT source/quality lookahead.
  rebuild_checkpoint_scenes: 0 # Opt-in durable strict-prefix recovery (e.g. 256); RAM computation.
  rebuild_checkpoint_bytes: 536870912 # Per-generation recovery file cap (512 MiB).
  rebuild_prefetch_scenes: false # Experimental next-scene immutable input lookahead.
  profile_rebuild: false       # Rebuild SQL/fetch metrics and coordinator pipeline timings in run history.
  max_cues: 0                  # 0 = all cues in the selected scene, not all scenes.
  checkpoint_cues: 32
  timeout_seconds: 120.0
  prefetch_frames: 4           # Ready CPU frames queued ahead of inference; 0 disables.
  prefetch_scenes: true        # Verify/download one next scene while the current one scans.
storage:
  database: faces_state.sqlite3
  max_crop_bytes: 1048576      # JPEG byte budget (minimum 1024); adapts quality/size, including retained scan crops.
names:
  file: null                  # Optional instance-scoped performer_names.yml.
# Optional supplemental body identity evidence. Face recognizer stays unchanged.
# See docs/sapiensid-hybrid.md for verified assets and calibration.
# Uses models.device and the shared scan CPU queues; local paths are relative to this YAML.
sapiensid:
  enabled: false              # true lazily prepares missing assets when models.download_missing is true.
  # Independent persons share pose/inference with face-associated evidence.
  collection:
    enabled: false
    min_person_pixels: 64
    min_sharpness: 10.0
    min_keypoints: 4
    max_overlap: 0.65

  identities:
    enabled: false
    match_threshold: 0.85
    cohesion_threshold: 0.80
    ambiguity_margin: 0.10
    min_support: 3
    attach_min_support: 2
    min_appearance_distance: 4
    anchor_min_keypoints: 6
    anchor_min_sharpness: 25.0

  global_matching:
    enabled: false
    match_threshold: 0.90
    cohesion_threshold: 0.85
    ambiguity_margin: 0.10
    min_support: 3
    max_references: 32

  model:
    variant: wb12m             # wb12m (default, trained on more data) or wb4m. Changing variant separates cached embeddings.
    source_directory: recognition_models/sapiensid_v1/source # Destination for verified upstream source; Git is not required.
    checkpoint_directory: "" # Empty: models.directory/sapiensid_v1/<variant>. Or set an explicit destination for model.pth/model.yaml.
    model_yaml_sha256: 2aa66245bdf81631cf243aff26dc2bca30788ea77958981d1947bd750cbf93b9
  pose:
    path: recognition_models/sapiensid_v1/yolo26m-pose.pt # Destination for the pinned YOLO26m-pose checkpoint.
    sha256: 2fbf16367022256a226035695c5c389384c6706e8bb8ab8fcd0e7976f05443c4 # Custom hashes require a matching local file.
    score_threshold: 0.50    # Minimum body detection confidence.
    keypoint_score_threshold: 0.50 # Minimum confidence for usable pose keypoints.
    nms_threshold: 0.70      # Body detector NMS IoU threshold; also applied to YOLO26's one-to-many head.
    max_people_per_frame: 100 # Body detections per thumbnail; separate from detection.max_faces_per_frame.
  matching:
    face_floor: 0.40         # Required face compatibility for a hybrid match; not a standalone face match threshold.
    person_threshold: 0.85   # Body cosine threshold; never averaged with face scores.
    ambiguity_margin: 0.10  # Required separation from competing identities.
    min_support: 3          # Independent body observations supporting an identity.
  execution:
    batch_size: 1           # 1..16 person inputs per inference batch, within CPU queue budgets.
    reference_bytes: 134217728 # 128 MiB for hybrid reference banks and lookup working arrays.
    plan_bytes: 16777216    # 16 MiB for retained hybrid decision proofs and plans.
    max_candidate_pairs: 100000 # Stop explicitly if the hybrid candidate graph exceeds this budget.
  consolidation:
    scope: selected  # retained consumes queued merges across retained scenes.
    scene_ids: []    # Optional allowlist for retained scope; [] means this library/namespace.
    max_scenes: 1000 # Bound automatic replay expansion. HTTP publication stays selected.
  storage:
    retain_person_crops: true # Keep body crops for inspection; bounded by storage.max_crop_bytes.
