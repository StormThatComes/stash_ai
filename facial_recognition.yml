# Loaded only by explicit `recognition run` / `recognition portraits`; never enables a background task.
# Similarities are cosine scores, not identity probabilities. These conservative
# starting defaults have no claimed accuracy calibration for your VTT library.
version: 1
models:
  detector: yunet
  recognizer: sface             # Optional auraface uses the same application dependencies.
  device: cuda                 # GPU by default. CPU profile: explicitly choose cpu.
  directory: recognition_models
  download_missing: true       # Only inside the explicit recognition invocation.
detection:
  score_threshold: 0.90
  nms_threshold: 0.30
  min_face_pixels: 32
  min_sharpness: 10.0
  max_faces_per_frame: 100
  max_pose_deviation: 0.50     # Hard five-landmark pose gate, not degrees; null disables.
  min_visible_face_fraction: 0.80 # Hard FaceOcc visibility gate; 0 disables recognition segmentation.
  require_complete_face: true # Reject face boxes cut off by the thumbnail boundary.
recognition:
  metric: cosine
  match_threshold: 0.65        # Higher means more similar. Model-specific.
  ambiguity_margin: 0.10
  cooccurrence_merge_threshold: 0.90 # Stronger cross-sample evidence for possible reflections.
  cross_scene_provisional: true # Accumulate independent withheld anchor support across selected scenes.
  min_identity_support: 1      # Independent cue times for a new person.
  min_merge_support: 3         # Distinct scene/time observations before merging identities.
clustering:
  cohesion_threshold: 0.60     # Minimum sample similarity for matching and group merges.
  same_scene_match_bonus: 0.03 # Lower local match AND cohesion for attachments and supported in-scene merges.
  same_scene_min_support: 3    # Strict local anchor cue times before local matching or merging.
  max_anchor_pose_deviation: 0.20 # Higher-pose faces may match anchors but never seed identities.
  auxiliary_matching: true    # Attach profiles after strict groups are established.
  auxiliary_min_support: 1    # Distinct scene/time observations required to accept attachments.
  view_prototypes_enabled: true # Opt in to multi-view identity reference prototypes.
  context_view_enrichment: true # Additional views only after strict-core revalidation of 2+ contextual cues.
  anchor_view_matching: true    # Additional frozen subcluster matching for withheld anchor observations.
  view_min_support: 3          # Independent anchor-confirmed cues needed to promote a view.
  view_cohesion_threshold: 0.80 # All retained exemplars must agree; no single-link chaining.
  view_match_threshold: 0.82   # Stronger cosine gate for matching via a view prototype.
  view_ambiguity_margin: 0.12 # Rival identities remain independently checked.
  view_attach_min_support: 2  # New view-only attachments need independent cues.
  max_view_prototypes_per_person: 4 # Bounded confirmed view reference medoids.
  max_samples_per_person: 32
  max_people_per_lookup: 20000
  max_reference_bytes: 134217728 # 128 MiB of float32 references; run reports usage/peak. Not total RAM/VRAM.
portraits:
  enabled: true               # false removes app-owned portraits for selected accepted people.
  source: vtt                  # Default: recognition thumbnail. Optional video uses FFmpeg.
  # Quality targets are ranking preferences: imperfect faces still supply a portrait.
  # detection.* remains the separate hard gate for recognition observations.
  min_face_pixels: 96          # Preferred actual face pixels; 0 removes this target penalty.
  min_sharpness: 25.0
  max_pose_deviation: 0.35
  min_exposure: 30.0
  max_exposure: 225.0
  max_clipped_fraction: 0.15
  min_visible_face_fraction: 0.80 # Preferred visible fraction; 0 removes the extra target penalty.
  margin: 0.35                 # Extra padding per side, relative to face width/height.
  aspect_ratio: null           # null = padded face shape; 0.8 = 4:5. Adapts if the source cannot fit it.
  jpeg_quality: 90             # Preferred 1..100; lowers quality/size to fit storage.max_crop_bytes.
  max_candidates: 8           # Video only. VTT ranks all retained observations of selected people.
  time_offsets: [0.0, -0.5, 0.5] # Video only.
  timeout_seconds: 30.0        # Video only.
  max_video_bytes: 67108864    # Video only.
  ffmpeg: ffmpeg               # Video only; executable name or path.
  weights:
    frontal: 3.0
    sharpness: 2.0
    resolution: 1.0
    exposure: 1.0
    visibility: 3.0            # 0 disables portrait visibility inference; detection gate is independent.
    neutral_expression: 0.0    # Opt-in: e.g. 3.0 prefers weaker visible expression.
    closed_mouth: 0.0          # Opt-in: e.g. 2.0 favors a lower jawOpen score.
    open_mouth: 0.0            # Favors jawOpen instead; normally choose one mouth weight.
    open_eyes: 0.0             # Opt-in: e.g. 2.0 penalizes either eye blinking.
execution:
  rebuild_workers: 1           # 1 = serial; 0 = auto (up to 16); explicit values up to 256.
  rebuild_native_threads: 1    # BLAS threads per compute worker; effective workers respect available CPUs.
  rebuild_queue_bytes: 67108864 # Pending CPU work budget; capped at rebuild_memory_bytes / 16.
  rebuild_memory_bytes: 8589934592  # Lazy working-cache budget (8 GiB); configurable for large-RAM hosts.
  portrait_cpu_threads: 0      # 0 = native defaults; 1 = serial; 2..16 = total CPU budget.
  portrait_faceocc_batch_size: 4 # Portrait-only visibility microbatch; 1 = scalar.
  prefetch_portraits: true     # Isolated bounded VTT source/quality lookahead.
  rebuild_checkpoint_scenes: 0 # Opt-in durable strict-prefix recovery (e.g. 256); RAM computation.
  rebuild_checkpoint_bytes: 536870912 # Per-generation recovery file cap (512 MiB).
  rebuild_prefetch_scenes: false # Experimental next-scene immutable input lookahead.
  profile_rebuild: false       # Bounded rebuild timings/work counts saved in run history.
  max_cues: 0                  # 0 = all cues in the selected scene, not all scenes.
  checkpoint_cues: 32
  timeout_seconds: 120.0
  prefetch_frames: 4           # Ready CPU frames queued ahead of inference; 0 disables.
  prefetch_scenes: true        # Verify/download one next scene while the current one scans.
storage:
  database: faces_state.sqlite3
  max_crop_bytes: 1048576      # JPEG byte budget (minimum 1024); adapts quality/size, including retained scan crops.
names:
  file: null                  # Optional instance-scoped performer_names.yml.
